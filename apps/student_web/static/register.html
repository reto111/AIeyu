<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 · AIeyu 俄语备考</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/student-refinement.css">
</head>
<body class="auth-page" data-auth-mode="register">
  <main class="auth-surface">
    <a class="auth-brand" href="/">AIeyu <span lang="ru">Русский язык</span></a>
    <h1>注册账号</h1>
    <form id="authForm">
      <label class="field"><span>姓名 / 用户名</span><input name="display_name" type="text" required maxlength="40" autocomplete="username"></label>
      <label class="field"><span>当前年级</span><select name="student_year" required><option value="" disabled selected>请选择年级</option><option value="1">大一</option><option value="2">大二</option><option value="3">大三</option><option value="4">大四</option></select></label>
      <label class="field"><span>密码（至少 8 位）</span><input name="password" type="password" required minlength="8" maxlength="80" autocomplete="new-password"></label>
      <label class="field"><span>确认密码</span><input name="confirmation" type="password" required minlength="8" maxlength="80" autocomplete="new-password"></label>
      <p id="authMessage" role="status" aria-live="polite"></p>
      <button id="authSubmit" class="primary" type="submit">注册</button>
    </form>
    <p class="auth-alternate">已有账号？ <a href="/login.html">去登录</a></p>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
